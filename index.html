<!DOCTYPE html>
<html>
<head>
    <title>AI Chatbot</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            font-family: Arial;
        
            background-image: url(img.avif);
        }

        .chatbox {
            width: 400px;
            margin: 100px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        .messages {
            height: 300px;
            overflow-y: auto;
            border: 1px solid black;
            padding: 10px;
            margin-bottom: 10px;
        }

        .user {
            text-align: right;
            color: blue;
        }

        .bot {
            text-align: left;
            color: green;
        }

        input {
            width: 75%;
            padding: 10px;
        }

        button {
            padding: 10px;
            background: blue;
            color: white;
            border:1px soil black;
        }
    </style>
</head>
<body>

<div class="chatbox">
    <h2>AI Chatbot 🤖</h2>

    <div class="messages" id="chat"></div>

    <input type="text" id="userInput" placeholder="Type message...">
    <button onclick="sendMessage()">Send</button>
</div>

<script>
function getBotResponse(input) {
    input = input.toLowerCase();

    if (input.includes("bye")) {
        return "Goodbye! 😊";
    }
    else if (input.includes("hello") || input.includes("hi") || input.includes("hey")) {
        return "Hello! How can I help you?";
    }
    else if (input.includes("how are you")) {
        return "I am fine 😊";
    }
    else if (input.includes("your name")) {
        return "I am a simple AI Chatbot";
    }
    else if (input.includes("help")) {
        return "I can answer basic questions!";
    }
    else if (input.includes("thank")) {
        return "You're welcome 😊";
    }
    else {
        return "I am still learning 🤖";
    }
}

function sendMessage() {
    let input = document.getElementById("userInput").value;

    if (input === "") return;

    let chat = document.getElementById("chat");

    chat.innerHTML += "<div class='user'>You: " + input + "</div>";

    let response = getBotResponse(input);

    chat.innerHTML += "<div class='bot'>Bot: " + response + "</div>";

    chat.scrollTop = chat.scrollHeight;

    document.getElementById("userInput").value = "";
}
</script>

</body>
</html>
